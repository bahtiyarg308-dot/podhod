<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Письма для Firebase</title>
<style>body{margin:0;padding:20px 16px 60px;background:#101114;color:#EDEDEA;font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}main{max-width:720px;margin:0 auto}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:28px 0 4px}p{color:#A9ABB2;margin:0 0 10px}button{background:#C5F23A;color:#0F1A00;border:0;border-radius:12px;padding:13px 22px;font:700 16px inherit;cursor:pointer}textarea{display:block;width:100%;box-sizing:border-box;margin-top:10px;background:#1A1B20;color:#CFCFCA;border:1px solid #2B2D33;border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace}.ok{color:#C5F23A;margin-left:10px}</style></head><body><main>
<h1>Письма для Firebase</h1><p>Нажмите «Скопировать письмо», затем вставьте текст в поле Message нужного шаблона (Ctrl+V) и сохраните.</p>
<section><h2>Письмо про пароль</h2><p>Шаблон Password reset</p><button data-t="reset">Скопировать письмо</button><textarea id="reset" readonly rows="6">&lt;div style=&quot;display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px&quot;&gt;Ссылка действует недолго. Задайте новый пароль и возвращайтесь к тренировкам.&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&lt;/div&gt;
&lt;table role=&quot;presentation&quot; width=&quot;100%&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;background:#EEF0E9;padding:24px 12px&quot;&gt;&lt;tr&gt;&lt;td align=&quot;center&quot;&gt;
&lt;table role=&quot;presentation&quot; width=&quot;560&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;width:100%;max-width:560px;background:#FFFFFF;border-radius:20px;overflow:hidden&quot;&gt;
&lt;tr&gt;&lt;td style=&quot;padding:0;line-height:0;background:#101114&quot;&gt;&lt;img src=&quot;https://bahtiyarg308-dot.github.io/podhod/mail/header.gif&quot; width=&quot;560&quot; alt=&quot;Подход&quot; style=&quot;display:block;width:100%;max-width:560px;height:auto;border:0&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:30px 34px 6px;font-family:-apple-system,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif&quot;&gt;
&lt;h1 style=&quot;margin:0 0 12px;font-size:26px;line-height:1.2;font-weight:800;color:#14151A&quot;&gt;Новый пароль&lt;/h1&gt;
&lt;p style=&quot;margin:0 0 24px;font-size:16px;line-height:1.55;color:#3A3D44&quot;&gt;Привет! Мы получили просьбу сменить пароль в «Подходе». Нажмите кнопку и придумайте новый. Старый пароль перестанет работать.&lt;/p&gt;
&lt;table role=&quot;presentation&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot;&gt;&lt;tr&gt;&lt;td bgcolor=&quot;#C5F23A&quot; style=&quot;border-radius:14px&quot;&gt;&lt;a href=&quot;%LINK%&quot; target=&quot;_blank&quot; style=&quot;display:inline-block;padding:15px 30px;font-family:-apple-system,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#0F1A00;text-decoration:none;border-radius:14px&quot;&gt;Задать новый пароль&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p style=&quot;margin:22px 0 0;font-size:14px;line-height:1.5;color:#5E626B&quot;&gt;Ссылка действует недолго. Если письмо запросили не вы, ничего делать не нужно: пароль останется прежним.&lt;/p&gt;
&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:26px 34px 30px;font-family:-apple-system,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif&quot;&gt;
&lt;p style=&quot;margin:0 0 12px;padding-top:18px;border-top:1px solid #E4E6DF;font-size:12px;line-height:1.55;color:#80848D&quot;&gt;Кнопка не нажимается? Скопируйте ссылку в браузер:&lt;br&gt;&lt;a href=&quot;%LINK%&quot; target=&quot;_blank&quot; style=&quot;color:#4F8A00;word-break:break-all&quot;&gt;%LINK%&lt;/a&gt;&lt;/p&gt;
&lt;p style=&quot;margin:0;font-size:12px;line-height:1.55;color:#80848D&quot;&gt;Вы получили это письмо, потому что для этого адреса запросили смену пароля в «Подходе».&lt;/p&gt;
&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;</textarea></section>
<section><h2>Письмо подтверждения</h2><p>Шаблон Email address verification (Google пока не даёт менять его текст — оставьте как есть)</p><button data-t="verify">Скопировать письмо</button><textarea id="verify" readonly rows="6">&lt;div style=&quot;display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px&quot;&gt;Осталась одна кнопка — и «Подход» откроется.&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&lt;/div&gt;
&lt;table role=&quot;presentation&quot; width=&quot;100%&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;background:#EEF0E9;padding:24px 12px&quot;&gt;&lt;tr&gt;&lt;td align=&quot;center&quot;&gt;
&lt;table role=&quot;presentation&quot; width=&quot;560&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot; style=&quot;width:100%;max-width:560px;background:#FFFFFF;border-radius:20px;overflow:hidden&quot;&gt;
&lt;tr&gt;&lt;td style=&quot;padding:0;line-height:0;background:#101114&quot;&gt;&lt;img src=&quot;https://bahtiyarg308-dot.github.io/podhod/mail/header.gif&quot; width=&quot;560&quot; alt=&quot;Подход&quot; style=&quot;display:block;width:100%;max-width:560px;height:auto;border:0&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:30px 34px 6px;font-family:-apple-system,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif&quot;&gt;
&lt;h1 style=&quot;margin:0 0 12px;font-size:26px;line-height:1.2;font-weight:800;color:#14151A&quot;&gt;Подтвердите почту&lt;/h1&gt;
&lt;p style=&quot;margin:0 0 24px;font-size:16px;line-height:1.55;color:#3A3D44&quot;&gt;Привет! Это «Подход» — дневник тренировок с напарником, который растёт вместе с вами. Нажмите кнопку, чтобы подтвердить, что эта почта ваша.&lt;/p&gt;
&lt;table role=&quot;presentation&quot; cellpadding=&quot;0&quot; cellspacing=&quot;0&quot;&gt;&lt;tr&gt;&lt;td bgcolor=&quot;#C5F23A&quot; style=&quot;border-radius:14px&quot;&gt;&lt;a href=&quot;%LINK%&quot; target=&quot;_blank&quot; style=&quot;display:inline-block;padding:15px 30px;font-family:-apple-system,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;color:#0F1A00;text-decoration:none;border-radius:14px&quot;&gt;Подтвердить почту&lt;/a&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p style=&quot;margin:22px 0 0;font-size:14px;line-height:1.5;color:#5E626B&quot;&gt;После этого вернитесь в приложение — оно откроется само.&lt;/p&gt;
&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td style=&quot;padding:26px 34px 30px;font-family:-apple-system,&#x27;Segoe UI&#x27;,Roboto,Helvetica,Arial,sans-serif&quot;&gt;
&lt;p style=&quot;margin:0 0 12px;padding-top:18px;border-top:1px solid #E4E6DF;font-size:12px;line-height:1.55;color:#80848D&quot;&gt;Кнопка не нажимается? Скопируйте ссылку в браузер:&lt;br&gt;&lt;a href=&quot;%LINK%&quot; target=&quot;_blank&quot; style=&quot;color:#4F8A00;word-break:break-all&quot;&gt;%LINK%&lt;/a&gt;&lt;/p&gt;
&lt;p style=&quot;margin:0;font-size:12px;line-height:1.55;color:#80848D&quot;&gt;Вы получили это письмо, потому что этот адрес указали при регистрации в «Подходе». Если это были не вы, просто удалите письмо: ничего не изменится.&lt;/p&gt;
&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;</textarea></section>
</main><script>document.querySelectorAll('button[data-t]').forEach(function(b){b.addEventListener('click',function(){var t=document.getElementById(b.dataset.t);t.focus();t.select();var done=function(){var o=document.createElement('span');o.className='ok';o.textContent='Скопировано';b.after(o);setTimeout(function(){o.remove()},2500)};try{navigator.clipboard.writeText(t.value).then(done,function(){document.execCommand('copy');done()})}catch(e){document.execCommand('copy');done()}})});document.querySelectorAll('textarea').forEach(function(t){t.addEventListener('focus',function(){t.select()})});</script></body></html>

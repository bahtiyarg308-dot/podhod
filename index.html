SHEETS.friend = sh => {
  const m = S.remote[sh.sid]; if (!m) return `${sheetHead('Партнёр')}<div class="sheet-body"><p class="muted">Нет данных.</p></div>`;
  const c = ctxRemote(sh.sid), st = gameStats(c), L = levelOf(totalXP(st, c)), wk = weekSummary(m.workouts), streak = goalStreak(c).n, qd = questsFor(c, weekStart(Date.now())).filter(x => x.done).length;
  const live = m.live && Date.now() - m.live.start < 4 * 3600e3;
  const body = (m.profile.body || []).slice().sort((a, b) => b.d - a.d)[0];
  return `${sheetHead(esc(m.name || 'Партнёр'), live ? 'Сейчас тренируется' : (m.workouts[0] ? 'Последняя тренировка ' + relDays(m.workouts[0].start) : 'Пока без тренировок'))}<div class="sheet-body">
    <div style="display:grid;place-items:center;margin:-6px 0 12px">${charSVG(charOf(m), moodOf(m.workouts, c.profile.goal, live), { color:pcolor(m), cls:'big' })}</div>
    <div class="lvl" style="margin-top:0;--accent:${col(m)[1]}"><span class="lvl-n" style="background:${col(m)[0]};color:${col(m)[2]}">${L.k}</span><span class="lvl-main"><b>${esc(L.title)}</b><span class="lvl-bar"><i style="width:${L.pct.toFixed(1)}%;background:${col(m)[0]}"></i></span></span><span class="lvl-xp">${L.cur}/${L.need} XP</span></div>
    <div class="kv k4" style="margin-top:12px"><div><b>${wk.n}</b><span>на этой неделе</span></div><div><b>${streak}</b><span>серия, недель</span></div><div><b>${m.workouts.length}</b><span>всего</span></div><div class="is-pr"><b>${c.D.prEvents.length}</b><span>рекордов</span></div></div>
    <p class="fine">Задания недели: <b style="color:var(--ink)">${qd} из 3</b></p>
    ${body ? `<p class="fine">Вес тела: <b style="color:var(--ink)">${nf(body.w, 1)} кг</b> · ${dShort(body.d)}</p>` : ''}
    <div class="sblock" style="border:0"><b>Последние тренировки</b>${m.workouts.length ? m.workouts.slice(0, 12).map(w => feedRow(m, w, false)).join('') : '<p class="fine">Здесь появятся тренировки.</p>'}</div>
  </div>`;
};

    <div class="sblock"><b>Синхронизация с партнёром</b>${syncCfg() ? `

      <div class="srow" style="border:0;padding-bottom:0"><div class="srow-t"><b>Показывать вес тела</b><span>Партнёр увидит ваши записи веса</span></div><button class="switch" role="switch" aria-checked="${!!S.meta.sync.shareBody}" aria-label="Показывать вес тела партнёру" data-act="toggleShareBody"></button></div>`
      : `<p class="fine" style="margin:0 0 10px">Ваши телефоны будут видеть тренировки и рекорды друг друга, даже если вы в разных залах. Бесплатно, через ваш GitHub.</p><button class="btn btn-sm btn-primary" data-act="syncSetup">${icon('users')} Настроить</button>`}</div>
    <div class="srow"><div class="srow-t"><b>Профили на этом телефоне</b><span>${profiles().length > 1 ? profiles().map(pname).join(', ') : 'Если тренируетесь вдвоём с одного телефона'}</span></div><button class="btn btn-sm" data-act="profiles">${icon('users')} Открыть</button></div>

};

/* ================= rest bar ================= */
function restHTML() {
  const t = S.rest, left = Math.max(0, Math.ceil((t.end - Date.now()) / 1000)), over = left === 0;
  const off = Math.max(0, Math.min(100, 100 * (1 - (t.end - Date.now()) / t.total)));
  return `<div class="restbar${over ? ' over' : ''}" role="timer" aria-label="Таймер отдыха">
    <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="ring-fg" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${off.toFixed(2)}"/></svg>
    <div class="rest-txt"><span class="rest-lbl">${over ? 'Пора работать' : 'Отдых'}</span><span class="rest-time" id="rest-time">${fmtClock(left)}</span></div>

  setDel: el => {
    const c = ctx(el); if (!c) return; const row = el.closest('.set-row');
    if (row) { if (row.classList.contains('leaving')) return; row.classList.add('leaving'); }
    setTimeout(() => { const i = c.x.sets.indexOf(c.s); if (i >= 0) c.x.sets.splice(i, 1); changed(); render(); }, RM ? 0 : 180);
  },
  setAdd: el => {
    const w = curW(), x = w && w.exercises[+el.dataset.x]; if (!x) return;
    const src = [...x.sets].reverse().find(s => !s.warm && (s.w != null || s.r != null || s.t != null || s.d != null));
    const n = {}; if (src) ['w', 'r', 't', 'd'].forEach(f => { if (src[f] != null) n[f] = src[f]; });
    x.sets.push(n); buzz(6); changed(); render();
  },
  copyPrev: el => {
    const c = ctx(el); if (!c) return; const last = lastEntry(c.x.ex, c.w.id, c.w.start), p = last && last.all[c.si]; if (!p) return;
    ['w', 'r', 't', 'd'].forEach(f => { if (p[f] != null) c.s[f] = p[f]; else delete c.s[f]; }); buzz(6); changed(); render();
  },
  exMenu: el => openSheet({ type:'xm', x:+el.dataset.x }),
  exNoteOpen: () => { const sh = top(), x = curW().exercises[sh.x]; if (x.note == null) x.note = ''; S.sheets.pop(); changed(); render(); const t = document.getElementById('xn-' + x.k); if (t) { t.focus(); t.scrollIntoView({ block:'center' }); } },
  exReplace: () => { const sh = top(); S.sheets.pop(); openSheet({ type:'pick', mode:'replace', x:sh.x, q:'', m:'all', sel:[] }); },
  exMove: el => { const sh = top(), w = curW(), i = sh.x, j = i + +el.dataset.d; if (j < 0 || j >= w.exercises.length) return; [w.exercises[i], w.exercises[j]] = [w.exercises[j], w.exercises[i]]; S.sheets.pop(); changed(); render(); },
  exRemove: () => { const sh = top(); if (!sh.confirm) { sh.confirm = true; render(); return; } curW().exercises.splice(sh.x, 1); S.sheets.pop(); changed(); render(); },
  finishOpen: () => openSheet({ type:'fin', feel:null, note:'' }),
  finFeel: el => { const sh = top(), v = +el.dataset.v; sh.feel = sh.feel === v ? null : v; render(); },
  finishSave: () => {
    const sh = top(); const w = finalize(clone(S.active)); w.end = Date.now();
    const note = (sh.note || '').trim(); if (note) w.note = note; if (sh.feel) w.feel = sh.feel;
    if (!w.exercises.length) { toast('Нет ни одного заполненного подхода'); return; }
    const st0 = gameStats(), xp0 = totalXP(st0), b0 = new Set(unlockedBadges(st0)), l0 = levelOf(xp0).k, q0 = new Set(questsFor(ctxLocal(), weekStart(w.start)).filter(x => x.done).map(x => x.id));
    S.active = null; S.rest = { end:0, total:0, alerted:false };
    saveWorkout(w); keepAwake(false);
    const st1 = gameStats(), xp1 = totalXP(st1), newBadges = unlockedBadges(st1).filter(id => !b0.has(id)), l1 = levelOf(xp1).k;
    S.sheets = []; S.bubble = null; buzz([30, 60, 30]);
    const newQuests = questsFor(ctxLocal(), weekStart(w.start)).filter(x => x.done && !q0.has(x.id)).map(x => x.t);
    go('log'); openSheet({ type:'done', id:w.id, prs:D.prCount[w.id] || 0, xpGain:xp1 - xp0, xpAfter:xp1, lvlUp:l1 > l0, newBadges, newQuests });
    if (isStandalone() && !S.persisted) requestPersist();
  },
  doneDetail: () => { const id = top().id; S.sheets = []; openSheet({ type:'wd', id }); },
  discardOpen: () => openSheet({ type:'disc' }),
  discardConfirm: () => { S.active = null; S.rest = { end:0, total:0, alerted:false }; saveActive(true); keepAwake(false); S.sheets = []; toast('Тренировка отменена'); render(); schedulePush(); },
  restAdj: el => { const d = +el.dataset.d * 1000; S.rest.end = Math.max(Date.now() + 1000, S.rest.end + d); S.rest.total = Math.max(S.rest.total + d, S.rest.end - Date.now()); buzz(6); renderRest(); },
  restSkip: () => { S.rest = { end:0, total:0, alerted:false }; renderRest(); },
  openWorkout: el => openSheet({ type:'wd', id:el.dataset.id }),
  wRepeat: () => { const w = S.workouts.find(x => x.id === top().id); if (w) startWorkout(null, w); },
  wAsTpl: () => {
    const w = S.workouts.find(x => x.id === top().id); if (!w) return;
    const items = w.exercises.map(x => { const k = exById(x.ex).kind, ws = x.sets.filter(s => !s.warm && valid(s, k)); const vals = ws.map(s => k === 'time' ? num(s.t) : k === 'cardio' ? Math.round((num(s.t) || 0) / 60) : num(s.r)); const mode = [...vals].sort((a, b) => vals.filter(v => v === b).length - vals.filter(v => v === a).length)[0]; return { ex:x.ex, sets:Math.max(1, ws.length), reps:mode ?? null }; });
    const name = w.title || 'Программа ' + (S.profile.templates.length + 1);
    S.profile.templates.push({ id:uid(), name, items }); saveProfile(); toast(`Программа «${name}» сохранена`); render();
  },
  wEdit: () => { const w = S.workouts.find(x => x.id === top().id); if (!w) return; S.editing = clone(w); S.sheets = []; S.view = 'editor'; render(); window.scrollTo(0, 0); },
  wDel: () => { const sh = top(); if (!sh.confirm) { sh.confirm = true; render(); return; } deleteWorkout(sh.id); S.sheets = []; toast('Тренировка удалена'); render(); },
  addPast: () => { const end = Math.floor(Date.now() / 60000) * 60000; S.editing = { id:uid(), title:'', tpl:null, start:end - 3600000, end, exercises:[], isNew:true }; S.view = 'editor'; render(); window.scrollTo(0, 0); },
  editSave: () => {
    const w = finalize(clone(S.editing)); if (!w.exercises.length) { toast('Добавьте хотя бы один заполненный подход'); return; }
    if (!(w.end > w.start)) w.end = w.start + 3600000;
    const isNew = S.editing.isNew; saveWorkout(w); S.editing = null; S.view = 'log';
    try { history.replaceState(null, '', '#log'); } catch (e) { /* hash blocked */ }
    toast(isNew ? 'Тренировка добавлена в журнал' : 'Изменения сохранены'); render(); window.scrollTo(0, 0);
  },
  editCancel: () => { S.editing = null; go('log'); },
  tplNew: () => openSheet({ type:'tpl', draft:{ id:uid(), name:'', items:[] }, isNew:true }),
  tplEdit: el => { const t = S.profile.templates.find(t => t.id === el.dataset.id); if (t) openSheet({ type:'tpl', draft:clone(t), isNew:false }); },
  tplSets: el => { const it = top().draft.items[+el.dataset.i]; it.sets = Math.max(1, Math.min(12, (it.sets || 3) + +el.dataset.d)); buzz(5); render(); },
  tplItemDel: el => { top().draft.items.splice(+el.dataset.i, 1); render(); },
  tplAddEx: () => openSheet({ type:'pick', mode:'tpl', q:'', m:'all', sel:[] }),
  tplSave: () => {
    const sh = top(), d = clone(sh.draft); d.name = (d.name || '').trim() || 'Программа';
    if (!d.items.length) { toast('Добавьте хотя бы одно упражнение'); return; }
    const i = S.profile.templates.findIndex(t => t.id === d.id); if (i >= 0) S.profile.templates[i] = d; else S.profile.templates.push(d);
    saveProfile(); S.sheets.pop(); toast('Программа сохранена'); render();
  },
  tplDel: () => { const sh = top(); if (!sh.confirm) { sh.confirm = true; render(); return; } S.profile.templates = S.profile.templates.filter(t => t.id !== sh.draft.id); saveProfile(); S.sheets.pop(); toast('Программа удалена'); render(); },
  setGoal: el => { S.profile.goal = +el.dataset.v; S.bubble = null; saveProfile(); buzz(6); render(); },
  setRest: el => { S.profile.rest = +el.dataset.v; saveProfile(); render(); },
  toggleSound: () => { S.profile.sound = !S.profile.sound; saveProfile(); unlockAudio(); buzz(8); render(); },
  setBar: el => { S.profile.bar = +el.dataset.v; saveProfile(); render(); },
  setTheme: el => { ensureMeta().theme = el.dataset.v; saveMeta(); applyTheme(); render(); },
  customDel: el => { const id = el.dataset.id; if (D.usage[id]) { toast('Это упражнение уже есть в журнале, поэтому его нельзя удалить'); return; } S.profile.custom = S.profile.custom.filter(e => e.id !== id); saveProfile(); render(); },
  backupShare: () => doBackup(true),
  backupFile: () => doBackup(false),
  snoozeBackup: () => { ensureMeta().backupSnooze = Date.now() + 3 * DAY; saveMeta(); render(); },
  hideInstall: () => { ensureMeta().installHide = Date.now() + 14 * DAY; saveMeta(); render(); },
  install: async () => { const e = S.installEvt; if (!e) { A.help(); return; } try { e.prompt(); const r = await e.userChoice; if (r && r.outcome === 'accepted') S.installEvt = null; } catch (err) { /* prompt unavailable */ } render(); },
  persist: async () => { await requestPersist(); toast(S.persisted ? 'Готово: браузер не будет очищать данные' : 'Браузер не разрешил. Установите приложение на главный экран — после этого попробуйте ещё раз.'); render(); },
  applyUpdate: () => { flush(); const w = S.updateReady; if (w) w.postMessage('skip'); else location.reload(); },
  exportCsv: () => {
    const c = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const dn = v => v == null ? '' : String(v).replace('.', ',');
    const rows = [['Дата', 'Время', 'Тренировка', 'Упражнение', 'Группа', 'Подход', 'Разминка', 'Вес, кг', 'Повторы', 'Время, сек', 'Дистанция, км']];
    [...S.workouts].reverse().forEach(w => w.exercises.forEach(x => { const ex = exById(x.ex); x.sets.forEach((s, i) => rows.push([dayKey(w.start), hm(w.start), w.title || 'Тренировка', ex.name, MUSCLES[ex.muscle] || '', i + 1, s.warm ? 'да' : '', dn(s.w), dn(s.r), dn(s.t), dn(s.d)])); }));
    saveFile(`podhod-${pname(curProf())}-${dayKey(Date.now())}.csv`, '﻿' + rows.map(r => r.map(c).join(';')).join('\n'), 'text/csv', !!navigator.canShare);
  },
  bodyAdd: () => {
    const v = parseNum($('#b-w').value), dv = $('#b-date').value;
    if (!(v >= 20 && v <= 400)) { toast('Введите вес в килограммах, например 58,5'); $('#b-w').focus(); return; }
    const d = dv ? new Date(dv + 'T08:00').getTime() : Date.now(); if (!Number.isFinite(d)) { toast('Проверьте дату'); return; }
    const k = dayKey(d); S.profile.body = S.profile.body.filter(e => dayKey(e.d) !== k); S.profile.body.push({ id:uid(), d, w:Math.round(v * 10) / 10 });
    $('#b-w').value = ''; saveProfile(); buzz(10); toast(`Записано: ${nf(v, 1)} кг`); render();
  },
  bodyDel: el => { S.profile.body = S.profile.body.filter(e => e.id !== el.dataset.id); saveProfile(); render(); },
  period: el => { S.prog.period = el.dataset.p; S.countUp = true; render(); },
  metric: el => { S.prog.metric = el.dataset.m; render(); },
};

/* ================= inputs ================= */
const IN = {
  set: el => {
    const c = ctx(el); if (!c) return; const { w, x, s, ex } = c, f = el.dataset.f;
    let v = parseNum(el.value); if (v != null && f === 't' && ex.kind === 'cardio') v = Math.round(v * 60); if (v != null && f === 'r') v = Math.round(v);
    if (v == null) delete s[f]; else s[f] = v;
    changed(); liveStats(w);
    if (f === 'w' && ex.equip === 'barbell') { const pl = document.getElementById('pl-' + x.k); if (pl) pl.innerHTML = platesHTML(v ?? topWeight(w, x, ex.kind), S.profile.bar); }
  },
  title: el => { const w = curW(); if (w) { w.title = el.value; changed(); } },
  exNote: el => { const w = curW(), x = w && w.exercises[+el.dataset.x]; if (x) { x.note = el.value; changed(); } },
  pickQ: el => { const sh = top(); sh.q = el.value; sh.creating = false; const l = $('#pick-list'); if (l) { const tmp = document.createElement('div'); tmp.innerHTML = pickList(sh); morphChildren(l, tmp); l.scrollTop = 0; } },
  finNote: el => { top().note = el.value; },
  tplName: el => { top().draft.name = el.value; },
  tplReps: el => { const v = parseNum(el.value); top().draft.items[+el.dataset.i].reps = v == null ? null : Math.round(v); },
  npName: el => { top().newName = el.value; },
  syncToken: el => { top().token = el.value; },
  syncCode: el => { top().code = el.value; },
  chatText: el => { S.chatDraft = el.value; el.style.height = 'auto'; el.style.height = Math.min(120, el.scrollHeight) + 'px'; },
  wlName: el => { top().name = el.value; },
  edStart: el => { const w = S.editing; if (!w) return; const ms = new Date(el.value).getTime(); if (Number.isFinite(ms)) { const dur = w.end - w.start; w.start = ms; w.end = ms + dur; } },
  edDur: el => { const w = S.editing; if (!w) return; const m = parseNum(el.value); if (m > 0) w.end = w.start + Math.round(m) * 60000; },
};
const CHG = {
  progEx: el => { S.prog.ex = el.value; S.prog.metric = null; render(); },
  cpName: el => { const p = ensureMeta().profiles.find(x => x.id === S.pid); if (!p) return; p.name = el.value.trim().slice(0, 24); saveMeta(); S.bubble = null; render(); schedulePush(); },
  imp: el => {
    const file = el.files && el.files[0]; el.value = ''; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d; try { d = JSON.parse(rd.result); } catch (e) { toast('Не получилось прочитать файл: это не резервная копия'); return; }
      if (!d || d.app !== 'podhod') { toast('Это не файл резервной копии «Подхода»'); return; }
      flush(); syncCur(); let n = 0, np = 0;
      if (d.version === 2 && d.data && d.meta && Array.isArray(d.meta.profiles)) {
        const meta = ensureMeta();
        d.meta.profiles.forEach(p => {
          if (!p || !p.id || !d.data[p.id]) return;
          if (!meta.profiles.some(x => x.id === p.id)) { meta.profiles.push({ id:p.id, name:p.name || '', color:COLORS[p.color] ? p.color : nextColor() }); np++; }
          n += mergeInto(p.id, d.data[p.id]);
        });
        saveMeta();
      } else if (Array.isArray(d.workouts)) {
        n += mergeInto(S.pid, d);
      } else { toast('В файле нет тренировок'); return; }
      loadProfileData(); S.sheets = []; S.bubble = null;
      toast(`Восстановлено: ${n} ${plural(n, ['тренировка','тренировки','тренировок'])}${np ? `, профилей: ${np}` : ''}`); render();
    };
    rd.readAsText(file);
  },
};

/* ================= events ================= */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.ch && CHG[el.dataset.ch]) CHG[el.dataset.ch](el, e); });
document.addEventListener('focusin', e => {
  const el = e.target; if (!el.dataset || el.dataset.in !== 'set' || el.dataset.f !== 'w') return;
  const c = ctx(el); if (!c || c.ex.equip !== 'barbell') return;
  const pl = document.getElementById('pl-' + c.x.k); if (pl) pl.innerHTML = platesHTML(num(c.s.w) ?? ghost(c.w, c.x, c.si, c.ex.kind).w ?? 0, S.profile.bar);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheets.length) { closeSheet(); return; }
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.in === 'set') {
    e.preventDefault();
    const c = ctx(el); if (!c) return; const fs = KINDS[c.ex.kind].f.map(f => f[0]);
    if (el.dataset.f === fs[0]) { const nx = document.getElementById(`s-${c.x.k}-${c.si}-${fs[1]}`); if (nx) nx.focus(); }
    else { el.blur(); if (!c.s.done) { const btn = el.closest('.set-row').querySelector('.set-check'); A.setDone(btn || el); } }
  }
  if (e.key === 'Enter' && el.id === 'b-w') { e.preventDefault(); A.bodyAdd(); }
  if (e.key === 'Enter' && el.id === 'w-title') { e.preventDefault(); el.blur(); }
  if (e.key === 'Enter' && el.id === 'wl-name') { e.preventDefault(); A.welcomeSave(); }
  if (e.key === 'Enter' && el.id === 'np-name') { e.preventDefault(); A.profCreate(); }
  if (e.key === 'Enter' && el.id === 'cp-name') { e.preventDefault(); el.blur(); }
  if (e.key === 'Enter' && !e.shiftKey && el.id === 'chat-in') { e.preventDefault(); A.chatSend(); }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) { S.editing = null; S.view = v; S.sheets = []; render(); window.scrollTo(0, 0); } });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawCharts(true); moveInd(); }, 150); });
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch (e) { /* old browser */ }

const h0 = location.hash.slice(1); if (VIEWS.includes(h0)) S.view = h0;
boot();
})();
</script>
</body>
</html>

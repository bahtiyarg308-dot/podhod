/* Layout: phone-first gym log, sport-minimal: graphite ground, one accent per person, condensed display type. One 760px column; floating dock at the bottom on phones, left rail from 960px; sheets rise from the bottom. Accent = the active profile's bumper-plate colour. */
@property --acc-l { syntax:'<color>'; inherits:true; initial-value:#E0283F }
@property --acc-d { syntax:'<color>'; inherits:true; initial-value:#FF5468 }
:root{
  color-scheme:dark;
  --acc-l:#E0283F; --acc-d:#FF5468; --acc-ink-l:#FFFFFF; --acc-ink-d:#1A0306;
  --bg:#0D0E10;
  --surface:#16171A;
  --surface-2:#202226;
  --ink:#F1F1EE;
  --ink-2:#C4C5C1;
  --muted:#8E9095;
  --line:#26282D;
  --edge:#060607;         /* hard bottom edge of tactile buttons */
  --accent:var(--acc-d);
  --accent-ink:var(--acc-ink-d);
  --accent-soft:color-mix(in oklab, var(--accent) 20%, var(--surface));
  --ring:var(--acc-l);
  --gold:#FFC93C; --gold-fill:#FFC93C; --gold-soft:#3A2F10; --on-gold:#1D1600;
  --good:#3DD68C; --good-soft:#10291C; --on-good:#04170D;
  --bad:#FF6B6B; --bad-soft:#3A1718; --on-bad:#1A0707;
  --inv-2:#D3D1CA;
  --knob:#FFFFFF;
  --plate-red:#D7263D; --plate-blue:#2447F0; --plate-yellow:#F2C230; --plate-green:#2E9E5B; --plate-white:#ECEAE3; --plate-black:#050608; --plate-steel:#8E939C;
  --h0:#23252A;
  --h1:color-mix(in oklab, var(--accent) 28%, var(--h0));
  --h2:color-mix(in oklab, var(--accent) 52%, var(--h0));
  --h3:color-mix(in oklab, var(--accent) 76%, var(--h0));
  --h4:var(--accent);
  --scrim:rgba(0,0,0,.6);
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --fleck:none;
  --f-display:"Oswald","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --r-lg:18px;
  --spring:cubic-bezier(.22,1,.36,1);
  --out:cubic-bezier(.2,.8,.2,1);
  transition:--acc-l .6s ease,--acc-d .6s ease;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#EFEFEC; --surface:#FFFFFF; --surface-2:#E7E7E3; --ink:#121212; --ink-2:#3A3A38; --muted:#646468; --line:#DCDCD7; --edge:#C9C9C3;
    --accent:var(--acc-l); --accent-ink:var(--acc-ink-l); --accent-soft:color-mix(in oklab, var(--accent) 15%, var(--surface)); --ring:var(--acc-d);
    --gold:#9A7300; --gold-fill:#F2C230; --gold-soft:#FBF0C8; --on-gold:#1D1600;
    --good:#13865A; --good-soft:#DAF1E4; --on-good:#FFFFFF;
    --bad:#C63434; --bad-soft:#F9E1E1; --on-bad:#FFFFFF;
    --inv-2:#33353B; --plate-white:#FAFAF6; --plate-black:#2A2D33; --plate-steel:#A9AEB8;
    --h0:#E0E0DA; --scrim:rgba(20,20,20,.38); --shadow:0 12px 30px rgba(20,20,20,.14);
    --fleck:none;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EFEFEC; --surface:#FFFFFF; --surface-2:#E7E7E3; --ink:#121212; --ink-2:#3A3A38; --muted:#646468; --line:#DCDCD7; --edge:#C9C9C3;
  --accent:var(--acc-l); --accent-ink:var(--acc-ink-l); --accent-soft:color-mix(in oklab, var(--accent) 15%, var(--surface)); --ring:var(--acc-d);
  --gold:#9A7300; --gold-fill:#F2C230; --gold-soft:#FBF0C8; --on-gold:#1D1600;
  --good:#13865A; --good-soft:#DAF1E4; --on-good:#FFFFFF;
  --bad:#C63434; --bad-soft:#F9E1E1; --on-bad:#FFFFFF;
  --inv-2:#33353B; --plate-white:#FAFAF6; --plate-black:#2A2D33; --plate-steel:#A9AEB8;
  --h0:#E0E0DA; --scrim:rgba(20,20,20,.38); --shadow:0 12px 30px rgba(20,20,20,.14);
  --fleck:none;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background-color:var(--bg);background-image:var(--fleck);background-size:140px 140px;background-attachment:fixed;color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-f{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{min-height:100%}
.main{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
.rail{display:none}
.tabbar{position:fixed;z-index:20;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:20px;background:color-mix(in oklab, var(--surface) 90%, transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border:1px solid var(--line);box-shadow:var(--shadow)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;font-size:11px;font-weight:600;color:var(--muted);transition:color .3s}
.tab .ic{width:22px;height:22px;transition:transform .35s var(--spring)}
.tab[aria-current="page"]{color:var(--accent-ink)}
.tab:active .ic{transform:scale(.85)}
.tab-ind{position:absolute;z-index:0;top:5px;left:0;height:calc(100% - 10px);border-radius:15px;background:var(--accent);opacity:0}
.tab-ind.ready{opacity:1;transition:transform .5s var(--spring),width .3s,background-color .6s}
.badge{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px var(--surface);animation:pulse 2s ease-in-out infinite}
.brand{display:flex;align-items:center;gap:10px;font:600 18px/1 var(--f-display);padding:0 12px 26px}
.logo{width:30px;height:30px;flex:none}
.logo .lp-s{stroke:var(--accent);transition:stroke .6s}
.logo .lp-r{stroke:currentColor;opacity:.25}
#rail-links{position:relative;display:grid;gap:4px}
.rail-ind{position:absolute;left:0;right:0;top:0;height:44px;border-radius:14px;background:var(--accent);opacity:0}
.rail-ind.ready{opacity:1;transition:transform .45s var(--spring)}
.rlink{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:14px;color:var(--ink-2);font-weight:600;transition:color .3s}
.rlink:hover{color:var(--ink)}
.rlink[aria-current="page"]{color:var(--accent-ink)}
.rlink .badge{position:static;margin-left:auto}
.rail-prof{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-weight:600;text-align:left;width:100%}
.rail-prof:hover{background:var(--surface-2)}
.rail-prof small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding-block:calc(28px + env(safe-area-inset-top,0px)) 20px;padding-right:16px;padding-left:max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .tabbar{display:none}
  .main{padding-top:36px;padding-bottom:110px}
}

/* ---------- motion: view entrance ---------- */
#main.enter .view>*,#main.enter .editor>*{animation:rise-in .55s var(--out) both}
#main.enter .view>*:nth-child(2),#main.enter .editor>*:nth-child(2){animation-delay:.05s}
#main.enter .view>*:nth-child(3),#main.enter .editor>*:nth-child(3){animation-delay:.1s}
#main.enter .view>*:nth-child(4),#main.enter .editor>*:nth-child(4){animation-delay:.15s}
#main.enter .view>*:nth-child(5),#main.enter .editor>*:nth-child(5){animation-delay:.2s}
#main.enter .view>*:nth-child(6),#main.enter .editor>*:nth-child(6){animation-delay:.25s}
#main.enter .view>*:nth-child(7),#main.enter .editor>*:nth-child(7){animation-delay:.3s}
#main.enter .view>*:nth-child(n+8),#main.enter .editor>*:nth-child(n+8){animation-delay:.35s}
#main.enter .wd b{animation:pop-in .5s var(--spring) both;animation-delay:calc(.12s + var(--i) * 45ms)}
#main.enter .jrow{animation:rise-in .5s var(--out) both;animation-delay:calc(.1s + var(--i) * 30ms)}
#main.enter .medal{animation:pop-in .5s var(--spring) both;animation-delay:calc(.15s + var(--i) * 35ms)}

/* ---------- type & headers ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.ph-text{min-width:0}
.ph-act{display:flex;gap:6px;align-items:center;flex:none}
.eyebrow{display:flex;align-items:center;gap:8px;font:500 10.5px/1.3 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.eyebrow .logo{width:18px;height:18px}
.h1{font:600 32px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin-top:8px;text-wrap:balance}
.h2{font:500 10.5px/1.3 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sec{margin-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;min-height:32px}

/* ---------- avatars ---------- */
.ava{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pc,#E0283F);color:var(--pci,#fff);font:600 14px/1 var(--f-display);flex:none;transition:background-color .4s}
.ava.lg{width:46px;height:46px;font-size:18px}
.ava-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:transform .3s var(--spring)}
.ava-btn:active{transform:scale(.9)}
.ava-btn .ava{box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in oklab, var(--pc) 45%, transparent)}

/* ---------- controls (tactile) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:background-color .2s,color .2s,transform .12s,box-shadow .12s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink-2);box-shadow:none}
.btn-ghost:active:not(:disabled){box-shadow:none}
.btn-soft{background:var(--accent-soft);color:var(--accent)}
.btn-danger{background:var(--bad);color:var(--on-bad)}
.btn-danger-soft{background:var(--bad-soft);color:var(--bad)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn-sm .ic{width:16px;height:16px}
.btn-lg{min-height:58px;font:600 18px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;border-radius:14px;padding:0 22px}
.btn-block{display:flex;width:100%}
.btn-add{display:flex;width:100%;min-height:54px;border:2px dashed var(--line);background:transparent;color:var(--ink-2);border-radius:18px;box-shadow:none}
.btn-add:active:not(:disabled){box-shadow:none}
.btn-add:hover{border-color:var(--accent);color:var(--accent)}
.start{position:relative;overflow:hidden}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink-2);flex:none;transition:background-color .2s,transform .25s var(--spring)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.88)}
.field{width:100%;height:46px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:0 14px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea.field{height:auto;min-height:76px;padding:10px 14px;resize:vertical;line-height:1.45}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lbl{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.select{position:relative;display:block}
.select select{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;font-weight:600}
.select::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:11px;font-size:13px;font-weight:600;color:var(--ink-2);transition:background-color .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);transition:background-color .2s,color .2s,transform .25s var(--spring)}
.chip:active{transform:scale(.93)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cdots{display:flex;flex-wrap:wrap;gap:10px;min-width:0;max-width:440px}
.cdot{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--surface),inset 0 0 0 1px rgba(127,127,127,.25);transition:box-shadow .25s,transform .3s var(--spring);position:relative}
.cdot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c);transform:scale(1.06)}
.cdot:active{transform:scale(.86)}
.switch{position:relative;width:50px;height:30px;border-radius:999px;background:var(--surface-2);transition:background-color .25s;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{background:var(--accent);box-shadow:none}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.pr-chip{display:inline-flex;align-items:center;gap:3px;font:600 10px/1.4 var(--f-mono);padding:3px 8px 2px 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.pr-chip .ic{width:12px;height:12px}

/* ---------- loading / empty / banners ---------- */
.loading{display:grid;gap:12px}
.sk{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
.sk.s2{height:140px}
.empty{padding:28px 20px;text-align:center;border:2px dashed var(--line);border-radius:var(--r-lg);color:var(--ink-2);background:color-mix(in oklab, var(--bg) 70%, transparent)}
.empty h3{font:600 18px/1.3 var(--f-display);color:var(--ink);margin-bottom:6px}
.empty p{font-size:14px;max-width:44ch;margin:0 auto}
.empty .btn{margin-top:16px}
.steps{display:grid;gap:14px;counter-reset:st;margin-top:4px}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;font-size:14px;color:var(--ink-2)}
.steps li::before{counter-increment:st;content:counter(st);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-display)}
.steps b{color:var(--ink);font-weight:600}
.banner{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);font-size:13px;margin-top:14px;color:var(--ink);border:1px solid color-mix(in oklab, var(--accent) 30%, transparent)}
.banner .ic{color:var(--accent)}
.banner-t{display:flex;gap:10px;align-items:flex-start;flex:1 1 240px;min-width:0}
.banner-a{display:flex;gap:6px}
.banner.warn{background:var(--gold-soft);border-color:color-mix(in oklab, var(--gold) 35%, transparent)}
.banner.warn .ic{color:var(--gold)}

/* ---------- hero: character, week goal, streak, level ---------- */
.hero{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;position:relative;overflow:hidden}
.ch-btn{display:grid;place-items:center;width:96px;height:96px;border-radius:22px;background:var(--surface-2)}
.hero-main{min-width:0;display:grid;gap:10px;justify-items:start}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap}
.hs b{display:flex;align-items:baseline;gap:4px;font:600 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hs b small{font-size:16px;color:var(--muted);font-weight:500}
.hs b .ic{width:18px;height:18px;color:var(--accent);align-self:center}
.hs span{display:block;font:500 10px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:5px}
.hs.warn span{color:var(--gold)}
/* characters: flat shapes in the profile colour (--cm), animated by mood */
.ch{--cm:var(--accent);--cd:color-mix(in oklab, var(--cm) 66%, #000);--cl:#F6F0E6;--ci:#17171B;width:88px;height:88px;overflow:visible;display:block;flex:none}
.ch .c-main{fill:var(--cm);transition:fill .6s}
.ch .c-dark{fill:var(--cd)}
.ch .c-light{fill:var(--cl)}
.ch .c-ink{fill:var(--ci)}
.ch .c-stroke{fill:none;stroke:var(--cm);stroke-linecap:round;transition:stroke .6s}
.ch .c-line{fill:none;stroke:var(--ci);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ch .c-wh{fill:none;stroke:var(--ci);stroke-width:1.3;stroke-linecap:round;opacity:.45}
.ch .c-shine{fill:#fff}
.ch .c-tongue{fill:#FF8FA3}
.ch .c-blush{fill:#FF8FA8;opacity:.5}
.ch .c-beak{fill:#F2B23A}
.ch .c-hop{animation:none}
.ch .c-all{transform-origin:50px 96px;animation:breathe 3.6s ease-in-out infinite}
.ch .c-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.ch .c-tail{animation:wag 2.6s ease-in-out infinite}
.ch .c-ear{animation:twitch 7s ease-in-out infinite}
.ch .c-ear.r{animation-name:twitch-r;animation-delay:2.4s}
.ch.m-happy .c-hop{animation:hop 6s 1.5s ease-in-out infinite}
.ch.m-happy .c-tail{animation-duration:1.1s}
.ch.m-fire .c-hop{animation:hop 2.2s ease-in-out infinite}
.ch.m-fire .c-tail{animation-duration:.7s}
.ch.m-sleepy .c-all{animation-duration:5.5s}
.ch.m-sleepy .c-tail,.ch.m-sleepy .c-ear{animation:none}
.ch.poke .c-hop{animation:jump .7s var(--out)}
.ch .c-z{font:600 15px var(--f-display);fill:var(--muted);animation:zz 2.4s ease-in-out infinite}
.ch .c-z2{animation-delay:1.2s;font-size:11px}
.ch .c-spark{fill:var(--gold-fill);transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.ch.still *{animation:none!important}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.chp{display:grid;justify-items:center;gap:6px;padding:10px 6px;border-radius:16px;background:var(--bg);border:2px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);transition:border-color .2s,background-color .2s}
.chp .ch{width:64px;height:64px}
.chp[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
/* weekly quests */
.quests{padding:4px 14px}
.q{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.q-ic .ic{width:18px;height:18px}
.q.done .q-ic{background:var(--accent);color:var(--accent-ink)}
.q-t{min-width:0}
.q-t b{display:block;font-weight:600;font-size:14px}
.q-bar{display:block;height:6px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.q-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transform-origin:left;animation:barx .8s var(--out) both}
.q-v{font:600 12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.q-v small{display:block;font-weight:500;font-size:10px;margin-top:3px}
.q.done .q-v{color:var(--accent)}
.q-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);padding:10px 0 8px;border-top:1px solid var(--line)}
.q-foot b{color:var(--ink);font-weight:600}
/* progress hint inside an exercise */
.x-hint{display:flex;align-items:center;gap:10px;width:calc(100% - 8px);margin:10px 4px 0;padding:9px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13px;text-align:left}
.x-hint>.ic{width:18px;height:18px;color:var(--accent)}
.x-hint b{font-family:var(--f-mono);font-weight:600}
.x-hint small{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.x-hint .go{margin-left:auto;font-weight:600;font-size:12px;color:var(--accent);white-space:nowrap}
.bubble{position:relative;display:inline-block;background:var(--surface-2);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:13.5px;line-height:1.35;color:var(--ink-2);animation:fade .4s ease both}
.goal{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.goal-dots{display:flex;gap:5px}
.goal-dots i{width:14px;height:14px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--line);transition:background-color .4s,transform .4s var(--spring)}
.goal-dots i.on{background:var(--accent);box-shadow:none}
.lvl{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--bg);text-align:left;width:100%;transition:transform .25s var(--spring)}
.lvl:active{transform:scale(.98)}
.lvl-n{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 18px/1 var(--f-display)}
.lvl-main{min-width:0}
.lvl-main b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvl-bar{display:block;height:8px;border-radius:4px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.lvl-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),color-mix(in oklab, var(--accent) 60%, var(--gold-fill)));transform-origin:left;transition:width .9s var(--out);animation:barx 1s var(--out) both}
.lvl-xp{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}

/* ---------- today ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 8px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px;font:500 10px var(--f-mono);color:var(--muted);text-transform:uppercase}
.wd b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;font:600 14px var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums;transition:background-color .4s,color .4s}
.wd.on b{background:var(--accent);color:var(--accent-ink)}
.wd.today b{box-shadow:inset 0 0 0 2px var(--ink)}
.wd.on.today b{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.wd.future b{color:var(--muted);font-weight:500}
.week-sum{font-size:13px;color:var(--ink-2);margin:10px 4px 16px}
.start .ic{width:20px;height:20px}
.progs{display:grid;gap:12px}
@media (min-width:620px){.progs{grid-template-columns:1fr 1fr}}
.prog{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 12px 12px 16px;min-width:0;transition:transform .3s var(--out)}
@media (hover:hover){.prog:hover{transform:translateY(-2px)}}
.prog-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.prog-name{font:600 17px/1.25 var(--f-display);padding-top:6px}
.prog-list{color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:-4px}
.prog-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.prog-meta{font-size:12px;color:var(--muted);min-width:0}
.prog-new{align-items:flex-start;justify-content:center;border-style:dashed;border-width:2px;background:transparent;color:var(--ink-2);min-height:120px;text-align:left;box-shadow:none}
.prog-new span{font-weight:700;color:var(--ink)}
.prog-new small{font-size:12px;color:var(--muted)}
.pair{display:grid;gap:4px;padding:8px 14px}
.pair-row{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:12px;align-items:center;padding:6px 0}
.pair-who{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600;text-align:left}
.pair-who span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair-who small{font-weight:500;font-size:12px;color:var(--muted)}
.pair-dots{display:flex;gap:5px}
.pair-dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.pair-dots i.on{background:var(--pc)}
.pair-n{font:600 14px var(--f-mono);text-align:right}

/* ---------- journal ---------- */
.month{margin-top:26px}
.month:first-of-type{margin-top:0}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 10px;border-bottom:1px solid var(--line)}
.month-head h2{font:600 16px var(--f-display)}
.month-head span{font:500 10.5px var(--f-mono);color:var(--muted);text-align:right}
.jrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px 6px;border-bottom:1px solid var(--line);transition:background-color .2s,transform .25s var(--spring)}
.jrow:hover{background:var(--surface)}
.jrow:active{transform:scale(.985)}
.jdate{display:block;text-align:center}
.jdate b{display:block;font:600 22px/1 var(--f-display)}
.jdate span{display:block;font:500 10px var(--f-mono);color:var(--muted);text-transform:uppercase;margin-top:5px}
.jmain{display:block;min-width:0}
.jtitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.jex{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink-2);margin-top:3px}
.jex i{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.jnums{display:block;text-align:right;font-variant-numeric:tabular-nums}
.jnums b{display:block;font-weight:700;white-space:nowrap}
.jnums span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}

/* ---------- editor ---------- */
.ed-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in oklab, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-top:-8px}
.ed-clock{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft);animation:pulse 2s ease-in-out infinite}
.ed-title{display:block;width:100%;border:0;border-radius:0;background:transparent;font:600 28px/1.2 var(--f-display);padding:4px 0 6px;margin-top:16px;color:var(--ink)}
.ed-title::placeholder{color:var(--muted);opacity:.7}
.ed-title:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.ed-when{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;margin-top:12px}
.ed-when .lbl,.ed-when .field{min-width:0}
.ed-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:14px 0 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--line);overflow:hidden}
.ed-stats>div{background:var(--surface);padding:10px 14px}
.ed-stats b{display:block;font:600 18px/1.3 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ed-stats span{font-size:12px;color:var(--muted)}
.ed-stats .is-pr b{color:var(--gold)}
.bump{animation:bump .45s var(--spring)}
.xlist{display:grid;gap:14px}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 10px 12px;min-width:0;animation:card-in .45s var(--out) both}
.x-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:0 4px 0 6px}
.x-name{font:700 16px/1.3 var(--f-body)}
.x-sub{font-size:12px;color:var(--muted);margin-top:2px}
.x-note{margin:10px 4px 0}
.x-note textarea{min-height:56px;font-size:14px}
.sets{display:grid;gap:4px;margin-top:10px}
.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) 68px 56px 40px 22px;gap:5px;align-items:center;padding:3px 4px;border-radius:12px;transition:background-color .35s,opacity .2s,transform .2s}
.set-row:not(.set-hd){animation:row-in .32s var(--out) both}
.set-row.leaving{opacity:0;transform:translateX(24px)}
.set-hd{font:500 9.5px var(--f-mono);text-transform:uppercase;color:var(--muted);padding-block:0 2px}
.set-hd span:nth-child(3),.set-hd span:nth-child(4){text-align:center}
.set-n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--ink-2);background:var(--surface-2);transition:background-color .25s,color .25s,transform .25s var(--spring)}
.set-n:active{transform:scale(.86)}
.set-n.warm{background:var(--gold-soft);color:var(--gold)}
.set-prev{font:500 11px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 0;text-align:left;min-width:0}
.set-prev:not(:disabled):hover{color:var(--accent)}
.set-in{width:100%;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);text-align:center;font:600 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);padding:0 2px;transition:border-color .2s,background-color .3s,box-shadow .2s}
.set-in::placeholder{color:var(--muted);opacity:.6;font-weight:400}
.set-in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.set-check{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);transition:background-color .3s,color .3s,transform .12s,box-shadow .12s}
.set-check:active{transform:scale(.92)}
.set-del{width:22px;height:28px;display:grid;place-items:center;color:var(--muted);border-radius:8px;opacity:.7}
.set-del:hover{opacity:1;color:var(--bad)}
.set-del .ic{width:15px;height:15px}
.set-row.done{background:var(--good-soft)}
.set-row.done .set-check{background:var(--good);color:var(--on-good)}
.set-row.done .set-in{background:transparent;border-color:transparent}
.set-row.pr{background:var(--gold-soft)}
.set-row.pr .set-check{background:var(--gold-fill);color:var(--on-gold)}
.set-row.just .set-check{animation:pop .5s var(--spring)}
.set-row.just .set-check .ic:not(.ic-f) path{stroke-dasharray:22;animation:draw .4s .05s ease both}
.set-row.just.pr .set-check .ic{animation:spin-in .6s var(--spring)}
.x-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:0 4px}
.x-sum{font:500 10.5px var(--f-mono);color:var(--muted);text-align:right}
.plates{display:flex;align-items:center;gap:12px;margin:10px 4px 0;padding:8px 12px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--ink-2);min-height:46px}
.pl-vis{display:flex;align-items:center;gap:2px;height:30px;flex:none}
.pl-collar{display:block;width:3px;height:12px;background:var(--plate-steel);border-radius:1px;margin-right:2px}
.pl{display:block;width:6px;border-radius:2px;animation:plate-in .35s var(--spring) both}
.pl:nth-child(3){animation-delay:.04s}.pl:nth-child(4){animation-delay:.08s}.pl:nth-child(5){animation-delay:.12s}.pl:nth-child(n+6){animation-delay:.16s}
.p25{height:30px;background:var(--plate-red)}
.p20{height:30px;background:var(--plate-blue)}
.p15{height:26px;background:var(--plate-yellow)}
.p10{height:22px;background:var(--plate-green)}
.p5{height:17px;width:5px;background:var(--plate-white);box-shadow:inset 0 0 0 1px var(--line)}
.p2_5{height:13px;width:4px;background:var(--plate-black);box-shadow:inset 0 0 0 1px var(--line)}
.p1_25{height:10px;width:4px;background:var(--plate-steel)}
.pl-sleeve{display:block;width:14px;height:5px;background:var(--plate-steel);border-radius:0 2px 2px 0}
.pl-txt{min-width:0}
.pl-txt b{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.ed-empty{padding:22px 18px;text-align:center;color:var(--ink-2);font-size:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);margin-bottom:12px}
.ed-add{margin-top:14px}
.ed-foot{display:grid;gap:10px;margin-top:22px}

/* ---------- rest timer ---------- */
.restbar{position:fixed;z-index:25;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:8px 8px 8px 10px;background:var(--ink);color:var(--bg);border-radius:20px;box-shadow:var(--shadow);width:min(440px,calc(100vw - 20px));transform:translateX(-50%);animation:bar-in .45s var(--spring) both;transition:background-color .35s,color .35s}
.restbar.out{animation:bar-out .22s ease-in both}
.restbar .ring{width:40px;height:40px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--inv-2);stroke-width:3.5}
.ring-fg{fill:none;stroke:var(--ring);stroke-width:3.5;stroke-linecap:round}
.rest-txt{display:flex;flex-direction:column;line-height:1.15;margin:0 auto 0 4px;min-width:0}
.rest-lbl{font:500 9.5px var(--f-mono);text-transform:uppercase;opacity:.7}
.rest-time{font:600 21px var(--f-display)}
.restbar .btn{background:var(--inv-2);color:var(--bg);min-height:36px;padding:0 10px;box-shadow:none}
.restbar .icon-btn{color:var(--bg);width:36px;height:36px}
.restbar .icon-btn:hover{background:var(--inv-2)}
.restbar.over{background:var(--good);color:var(--on-good);animation:ding .7s var(--spring) both}
.restbar.over .btn,.restbar.over .icon-btn{color:var(--on-good);background:transparent}
@media (min-width:960px){.restbar{bottom:24px;left:calc(50% + 120px)}}

/* ---------- toast & confetti ---------- */
.toast{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:16px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 24px);width:max-content;transform:translateX(-50%);animation:toast-in .45s var(--spring) both}
.toast.out{animation:toast-out .2s ease-in both}
.toast.pr{background:var(--gold-fill);color:var(--on-gold)}
.toast .ic{width:16px;height:16px}
.toast .btn{min-height:32px;background:var(--accent);color:var(--accent-ink);box-shadow:none}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .25s ease both}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:var(--shadow);animation:sheet-up .5s cubic-bezier(.32,.72,0,1) both}
#sheet-root.closing .scrim{animation:fade-out .22s ease both}
#sheet-root.closing .sheet{animation:sheet-down .24s cubic-bezier(.4,0,1,1) both}
.grab{display:grid;place-items:center;height:22px;margin-bottom:-12px;touch-action:none;cursor:grab}
.grab::before{content:"";width:42px;height:5px;border-radius:3px;background:var(--line)}
@media (min-width:720px){

.wd-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin-bottom:6px}

.chart{position:relative;width:100%}

.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt-last{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}

.composer{position:fixed;z-index:22;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));display:flex;gap:6px;align-items:flex-end;padding:5px;border-radius:18px;background:color-mix(in oklab, var(--surface) 94%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow)}

    return new Promise(res => {

  },
  set(k, v) {

    });
  },
  del(k) {
    return new Promise(res => {
      if (!this.db) { try { localStorage.removeItem('podhod:' + k); } catch (e) { /* ignore */ } res(true); return; }

function valid(s, kind) {
  if (kind === 'wr' || kind === 'bw') return num(s.r) > 0;
  if (kind === 'time') return num(s.t) > 0;
  if (kind === 'cardio') return num(s.t) > 0 || num(s.d) > 0;
  return false;
}
const e1rm = (w, r) => (!(w > 0) || !(r > 0)) ? 0 : (r === 1 ? w : w * (1 + r / 30));
function score(s, kind) {
  const w = num(s.w) || 0, r = num(s.r) || 0, t = num(s.t) || 0, d = num(s.d) || 0;
  if (kind === 'wr') return ['e', e1rm(w, r)];
  if (kind === 'bw') return w > 0 ? ['e', e1rm(w, r)] : ['r', r];
  if (kind === 'time') return ['t', t];

/* progress hint: double progression from the last session of this exercise */
const INC = { barbell:2.5, dumbbell:2, machine:2.5, cable:2.5, body:2.5, other:2.5 };
function hintFor(x, ex, last) {
  if (!last) return null;
  const ws = last.all.filter(s => !s.warm); if (!ws.length) return null;
  if (ex.kind === 'wr' || (ex.kind === 'bw' && ws.some(s => num(s.w) > 0))) {
    const topW = Math.max(...ws.map(s => num(s.w) || 0)); if (!(topW > 0)) return null;
    const top = ws.filter(s => (num(s.w) || 0) === topW), reps = top.map(s => num(s.r) || 0), r0 = reps[0];
    if (!(r0 > 0)) return null;
    const rirs = top.map(s => s.rir).filter(v => v != null), rir = rirs.length ? Math.min(...rirs) : null;
    const inc = INC[ex.equip] || 2.5, held = reps.every(r => r >= r0), up = k => Math.round((topW + inc * k) * 100) / 100;
    const prevTxt = `${reps.length}×${r0} · ${nf(topW, 2)} кг${rir == null ? '' : ', запас ' + (rir >= 3 ? '3+' : rir)}`;
    const lbl = (w, r) => `${nf(w, 2)} кг × ${r}`;
    if (held && rir != null && rir >= 3 && r0 >= 5) { const w = up(2); return { w, r:r0, label:lbl(w, r0), why:`В прошлый раз ${prevTxt}: было легко — прибавьте смелее` }; }
    if (held && rir === 0) return { w:topW, r:r0, label:lbl(topW, r0), why:`В прошлый раз ${prevTxt}: подходы на пределе — закрепите этот вес` };
    if (held && r0 >= 5) { const w = up(1); return { w, r:r0, label:lbl(w, r0), why:`В прошлый раз ${prevTxt}: все подходы взяты — прибавьте вес` }; }
    if (held) return { w:topW, r:r0 + 1, label:lbl(topW, r0 + 1), why:`В прошлый раз ${prevTxt}: закрепите вес и добавьте повтор` };
    return { w:topW, r:r0, label:lbl(topW, r0), why:`В прошлый раз повторы просели (${reps.join(', ')}) — добейте ${r0} во всех подходах` };
  }
  if (ex.kind === 'bw') { const mr = Math.max(...ws.map(s => num(s.r) || 0)); if (!mr) return null; return { r:mr + 1, label:`${mr + 1} ${plural(mr + 1, ['повтор','повтора','повторов'])}`, why:`Лучший подход в прошлый раз — ${mr}. Добавьте один повтор` }; }

}

}

async function loadPhotos() {
  const pid = S.pid; if (S.photosLoading === pid) return; S.photosLoading = pid;
  const list = (await KV.get('ph:' + pid)) || [];
  for (const p of list) if (!PHURL.has(p.id)) { const b = await KV.get('pb:' + p.id); if (b instanceof Blob) PHURL.set(p.id, URL.createObjectURL(b)); }
  S.photos = { pid, list:list.sort((a, b) => a.d - b.d), cmp:(S.photos && S.photos.pid === pid && S.photos.cmp) || [] }; S.photosLoading = null; render();
}
function shrinkImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function photosHTML() {

      <label class="lbl">Дата снимка<input type="date" class="field" id="ph-date" value="${today}" max="${today}"></label>

    </div><p class="fine">Фото хранятся только на этом телефоне: они не уходят партнёру и не попадают в резервную копию.</p></div>`;
  if (!list.length) return add + `<div class="sec empty"><h3>Фото «до / после»</h3><p>Снимайте раз в 2–4 недели в одном месте, при одном свете и в одной позе — тогда разница будет видна честно.</p></div>`;
  const pickP = (i, def) => list.find(p => p.id === P.cmp[i]) || def;
  const a = pickP(0, list[0]), b = pickP(1, list[list.length - 1]);
  const wAt = d => { const e = [...S.profile.body].sort((x, y) => Math.abs(x.d - d) - Math.abs(y.d - d))[0]; return e && Math.abs(e.d - d) < 10 * DAY ? nf(e.w, 1) + ' кг' : ''; };
  const fig = (l, p) => `<figure><img src="${PHURL.get(p.id) || ''}" alt="${l}, ${dShort(p.d)}"><figcaption><b>${l}</b> · ${dShort(p.d)}${wAt(p.d) ? ' · ' + wAt(p.d) : ''}</figcaption></figure>`;
  const days = Math.round((b.d - a.d) / DAY);

  const grid = `<section class="sec"><div class="sec-head"><h2 class="h2">Все фото · ${list.length}</h2></div><div class="phs">${[...list].reverse().map(p => `<button class="ph" data-act="phOpen" data-id="${esc(p.id)}" data-key="ph-${esc(p.id)}"><img src="${PHURL.get(p.id) || ''}" alt="Фото ${dShort(p.d)}"><span>${dShort(p.d)}</span></button>`).join('')}</div></section>`;
  return add + cmp + grid;

function closeSheet() {

function sheetHead(title, eyebrow = '') { return `<header class="sheet-head"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h2 id="sheet-title">${title}</h2></div><button class="icon-btn" data-act="closeSheet" aria-label="Закрыть">${icon('x')}</button></header>`; }
const closeOnly = () => `<header class="sheet-head" style="justify-content:flex-end;padding-bottom:0"><button class="icon-btn" data-act="closeSheet" aria-label="Закрыть">${icon('x')}</button></header>`;
let closeTok = 0;
function renderSheet() {
  const root = $('#sheet-root'), t = top();
  if (!t) {
    document.body.classList.remove('locked');
    if (root.firstChild && !root.classList.contains('closing')) {
      root.classList.add('closing'); const tok = ++closeTok;
      setTimeout(() => { if (tok === closeTok && !top()) { root.innerHTML = ''; root.dataset.key = ''; root.classList.remove('closing'); } }, 240);
    }
    return;
  }
  const html = '<div class="grab" aria-hidden="true"></div>' + (SHEETS[t.type] || (() => ''))(t);
  const sheet = root.querySelector('.sheet');
  if (root.dataset.key === t.key && sheet && !root.classList.contains('closing')) {
    const tmp = document.createElement('section'); tmp.innerHTML = html; morphChildren(sheet, tmp);
  } else {
    closeTok++; root.classList.remove('closing');
    root.innerHTML = `<div class="scrim" data-act="closeSheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${html}</section>`;
    root.dataset.key = t.key; bindDrag(root.querySelector('.sheet'));
    countUp(root);
    if (t.type === 'done' && (t.prs || t.lvlUp || (t.newBadges && t.newBadges.length))) setTimeout(() => confetti(window.innerWidth / 2, window.innerHeight * .3, t.lvlUp ? 150 : 100), 450);
  }

function bindDrag(sheet) {
  if (!sheet) return;
  let y0 = null, dy = 0, t0 = 0;
  sheet.addEventListener('pointerdown', e => {
    if (window.matchMedia('(min-width:720px)').matches) return;
    if (!e.target.closest('.grab,.sheet-head') || e.target.closest('button,input,select,textarea')) return;
    y0 = e.clientY; dy = 0; t0 = performance.now(); sheet.style.transition = 'none'; sheet.style.animation = 'none';
    try { sheet.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
  });
  sheet.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => {
    if (y0 == null) return; y0 = null;
    const fast = dy > 40 && dy / (performance.now() - t0) > .6;
    sheet.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)';
    if (dy > 120 || fast) { sheet.style.transform = 'translateY(105%)'; setTimeout(() => { if (top()) closeSheet(); }, 200); }
    else sheet.style.transform = '';
  };
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
}

SHEETS.help = () => `${sheetHead('Как пользоваться')}<div class="sheet-body help">
  <h3>1. Установите на телефон</h3>
  <p><b>iPhone:</b> откройте ссылку в Safari → кнопка «Поделиться» (квадрат со стрелкой) → «На экран “Домой”» → «Добавить».</p>
  <p><b>Android:</b> откройте ссылку в Chrome → меню ⋮ → «Установить приложение» (или «Добавить на главный экран»).</p>
  <p>После установки «Подход» открывается с иконки, работает без интернета и не зависит ни от каких аккаунтов.</p>
  <h3>2. В зале</h3>
  <ol><li>Нажмите «Начать тренировку» или «Начать» у программы.</li><li>Серые цифры в полях — ваш прошлый результат. Сделали так же — просто жмите галочку. Сделали больше — впишите новые цифры.</li><li>Нажмите на номер подхода, чтобы отметить его как разминочный («Р») — он не идёт в статистику.</li><li>Кнопка «Разминка» в упражнении добавит разминочные подходы к рабочему весу: пустой гриф, около 50, 75 и 90% от рабочего.</li><li>После подхода отметьте запас — сколько ещё могли сделать. По нему подсказка предложит вес на следующую тренировку.</li><li>После галочки сам запускается таймер отдыха. Его длительность меняется в настройках.</li><li>В конце — «Завершить»: тренировка попадёт в журнал, начислится опыт, а задания недели продвинутся.</li></ol>
  <h3>3. Программы</h3>
  <p>Удачную тренировку сохраните кнопкой «В программы» в журнале — в следующий раз начнёте её в одно касание.</p>
  <h3>4. Резервная копия — важно</h3>
  <p>Данные хранятся только на этом устройстве. Раз в пару недель нажимайте <b>Настройки → Резервная копия → Сохранить</b> и отправляйте файл себе в «Избранное» в Telegram, в Google Диск или «Файлы». При смене телефона установите приложение заново и нажмите «Восстановить из файла».</p>
  <h3>5. Вдвоём, в разных залах</h3>
  <ol><li>Один человек открывает <b>Настройки → Синхронизация → Настроить → «Я настраиваю первым»</b> и создаёт бесплатный ключ на GitHub (приложение подскажет, куда нажать).</li><li>Затем нажимает «Код для партнёра» и отправляет код второму.</li><li>Второй открывает <b>Настройки → Синхронизация → Настроить → «У меня есть код»</b> и вставляет его.</li></ol>
  <p>После этого на главной появится «Неделя вместе»: тренировки, рекорды и уровень партнёра, а ещё реакции — огонь, сердце и звезда. Обмен идёт, когда есть интернет, а в зале всё работает и без него. Синхронизация заодно служит облачной копией: на новом телефоне подключитесь тем же кодом и выберите «Это мой профиль — …». Если код вам прислал партнёр, всегда выбирайте «Я новый участник».</p>
  <h3>6. Один телефон на двоих</h3>
  <p>Добавьте второй профиль: нажмите на кружок с буквой вверху. У каждого профиля свой напарник, гардероб и добавки.</p>
  <h3>7. Напарник и сундуки</h3>
  <p>Напарник растёт с каждой тренировкой: малыш, юный, взрослый, атлет и легенда. Сытость — 100% после тренировки, первые два дня отдыха она не падает, потом снижается на 20% в день. Болеете или в отпуске — включите <b>Настройки → Заморозка</b>.</p>
  <p>За тренировку от ${CH_MIN_SETS} рабочих подходов дают сундук (один в день) с вещью для напарника. Рекорд повышает шанс редкой вещи, все три задания недели — золотой сундук. Повторы превращаются в искры: 100 искр — обычная вещь на выбор, 300 — редкая. Нажмите на напарника, чтобы открыть гардероб.</p>
  <h3>8. Добавки</h3>
  <p>Во вкладке «Добавки» составьте свой план: доза, время приёма, дни недели, курс и запас. Отмечайте приём галочкой — за полный день +10 XP. План личный и партнёру не передаётся.</p>
</div>`;

/* ================= rest bar ================= */
function restHTML() {

    <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="ring-fg" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${off.toFixed(2)}"/></svg>

function renderRest() {

  if (!S.rest.end) { if (cur && !cur.classList.contains('out')) { cur.classList.add('out'); setTimeout(() => { if (!S.rest.end) r.innerHTML = ''; }, 220); } return; }

/* ================= workout ops ================= */
function newEx(id, w, it) {
  const last = lastEntry(id, w.id, w.start);
  let sets;
  if (it) { sets = (last ? last.all.filter(s => s.warm).map(() => ({ warm:true })) : []); for (let i = 0; i < (it.sets || 3); i++) sets.push({}); }
  else if (last) sets = last.all.slice(0, 10).map(s => (s.warm ? { warm:true } : {}));
  else sets = [{}, {}, {}];
  return { k:uid(), ex:id, sets, target: it && it.reps != null && it.reps !== '' ? it.reps : null };
}
function startWorkout(tpl, fromW) {
  if (S.active) { toast('Сначала завершите текущую тренировку'); go('today'); return; }
  const w = { id:uid(), title: tpl ? tpl.name : fromW ? (fromW.title || '') : '', tpl: tpl ? tpl.id : fromW ? (fromW.tpl || null) : null, start:Date.now(), exercises:[] };
  if (tpl) tpl.items.forEach(it => w.exercises.push(newEx(it.ex, w, it)));
  if (fromW) fromW.exercises.forEach(x => w.exercises.push({ k:uid(), ex:x.ex, sets:x.sets.filter(s => valid(s, exById(x.ex).kind)).map(s => (s.warm ? { warm:true } : {})), target:null }));
  S.active = w; S.sheets = []; saveActive(true); keepAwake(true); unlockAudio(); buzz(15);
  go('today'); schedulePush();
}
function finalize(w) {
  w.exercises = (w.exercises || []).map(x => { const kind = exById(x.ex).kind; return { ...x, sets: x.sets.filter(s => valid(s, kind)).map(s => ({ ...s, done:true })) }; }).filter(x => x.sets.length);
  return w;
}
function ctx(el) {
  const w = curW(); if (!w) return null;
  const xi = +el.dataset.x, si = +el.dataset.i, x = w.exercises[xi]; if (!x) return null;
  return { w, xi, si, x, s: x.sets[si], ex: exById(x.ex) };
}
function go(v) {
  if (!VIEWS.includes(v)) v = 'today';
  if (S.view === 'editor') S.editing = null;
  const changedView = S.view !== v;
  S.view = v; if (v === 'chat') S.chatScroll = true;

  render(); if (changedView) window.scrollTo(0, 0);
}
function replaceEx(xi, id) { const w = curW(), x = w && w.exercises[xi]; if (!x) return; x.ex = id; x.target = null; x.sets = x.sets.map(s => (s.warm ? { warm:true } : {})); changed(); }
function fullBackup() {
  flush(); syncCur();
  const data = {}; profiles().forEach(p => { const d = S.store[p.id] || {}; data[p.id] = { profile:d.profile || null, workouts:d.workouts || [] }; });
  return { app:'podhod', version:2, exported:new Date().toISOString(), meta:{ profiles:profiles() }, data };
}
async function saveFile(name, text, mime, viaShare) {
  const blob = new Blob([text], { type:mime });
  if (viaShare && navigator.canShare && window.File) {
    try { const file = new File([blob], name, { type:mime }); if (navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return true; } }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  try { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); return true; }
  catch (e) { toast('Не получилось сохранить файл'); return false; }
}
async function doBackup(viaShare) {
  const ok = await saveFile(`podhod-backup-${dayKey(Date.now())}.json`, JSON.stringify(fullBackup()), 'application/json', viaShare);
  if (ok) { ensureMeta().lastBackup = Date.now(); saveMeta(); toast('Резервная копия сохранена'); render(); }
}
function mergeInto(pid, src) {
  const d = S.store[pid] || (S.store[pid] = {});
  const prof = normP(d.profile), inc = normP(src.profile);
  ['templates', 'custom', 'body', 'meas'].forEach(k => { const have = new Set(prof[k].map(o => o.id)); inc[k].forEach(o => { if (o && o.id && !have.has(o.id)) prof[k].push(o); }); });
  if (!d.profile && src.profile) ['rest', 'sound', 'bar', 'goal'].forEach(k => { if (src.profile[k] != null) prof[k] = src.profile[k]; });
  { const have = new Set(prof.supps.map(o => o.id)); inc.supps.forEach(o => { if (!have.has(o.id)) prof.supps.push(o); }); }
  Object.entries(inc.slog).forEach(([k, l]) => { if (Array.isArray(l)) prof.slog[k] = [...new Set([...(prof.slog[k] || []), ...l])]; });
  prof.sfull = [...new Set([...prof.sfull, ...inc.sfull])].sort();
  inc.freeze.forEach(f => { if (f && Number.isFinite(f.from) && !prof.freeze.some(x => x.from === f.from)) prof.freeze.push(f); });
  if (!Object.keys(prof.gear).length) prof.gear = inc.gear;
  const before = new Set((d.workouts || []).map(w => w.id));
  const ws = new Map((d.workouts || []).map(w => [w.id, w])); let n = 0;
  (src.workouts || []).forEach(w => { if (w && w.id && Number.isFinite(w.start) && Array.isArray(w.exercises)) { const c = normW(w, String(w.id)); delete c.demo; ws.set(c.id, c); n++; } });
  if (inc.chest && prof.chest) { Object.entries(inc.chest.op).forEach(([k, v]) => { if (!prof.chest.op[k] && ITEM[v]) prof.chest.op[k] = v; }); inc.chest.buy.forEach(b => { if (b && ITEM[b.id] && !prof.chest.buy.some(x => x.at === b.at && x.id === b.id)) prof.chest.buy.push(b); }); }
  else if (inc.chest && !prof.chest) prof.chest = inc.chest;
  else if (prof.chest) prof.chest.imp = [...new Set([...(prof.chest.imp || []), ...[...ws.keys()].filter(id => !before.has(id))])]; // a backup from before 2.2
  d.profile = prof; d.workouts = [...ws.values()].sort((a, b) => b.start - a.start); d.active = d.active || null;
  KV.set('p:' + pid, d);
  return n;
}

    } catch (e) { sh.busy = false; sh.err = typeof e === 'string' ? e : 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.'; render(); }

  shop: () => openSheet({ type:'shop', sel:null }),

  shopBuy: () => {
    const sh = top(), it = ITEM[sh.sel]; if (!it || it.r === 'l') return;
    const coll = collOf(S.profile, S.workouts), cost = it.r === 'r' ? 300 : 100;
    if (coll.has(it.id) || coll.sparks < cost) return;
    S.profile.chest.buy.push({ id:it.id, at:Date.now(), c:cost });
    S.profile.gear = Object.assign(gearOf(S.profile, collOf(S.profile, S.workouts)), { [it.s]:it.id });
    saveProfile(); S.sheets.pop(); buzz([10, 40, 10]); toast(`«${it.n}» в гардеробе — уже на напарнике`); render(); wardPoke();
  },
  chestOpenNext: () => { const cs = chestState(); if (cs.closed.length) chestOpenId(cs.closed[0].id); },
  chestOpenFor: el => chestOpenId(el.dataset.id),
  chestOpen: () => {
    const sh = top(); if (!sh || sh.type !== 'chest' || sh.phase !== 'closed') return;
    const cs = chestState(), ch = cs.all.find(x => x.id === sh.cid); if (!ch) return;
    if (!cs.op[ch.id]) {
      const id = rollChest(ch), had = collOf(S.profile, S.workouts).has(id);
      S.profile.chest.op[ch.id] = id; sh.dup = had; saveProfile();
    }
    const it = ITEM[S.profile.chest.op[ch.id]], reveal = () => {
      if (top() !== sh) return;
      sh.phase = 'open'; render();
      buzz(it.r === 'l' ? [40, 60, 40, 60, 120] : it.r === 'r' ? [30, 50, 30, 50, 60] : [20, 40, 20]);
      if (it.r !== 'c') { const r = $('#sheet-root .reveal .chest'); const b = r ? r.getBoundingClientRect() : { left:innerWidth / 2, top:innerHeight / 3, width:0, height:0 }; confetti(b.left + b.width / 2, b.top + b.height / 2, it.r === 'l' ? 110 : 60); }
    };
    if (RM) { reveal(); return; }
    sh.phase = 'shake'; buzz(12); render(); setTimeout(reveal, 1350);
  },
  chestWear: el => {
    const id = el.dataset.id, it = ITEM[id]; if (!it) return;
    S.profile.gear = Object.assign(gearOf(S.profile, collOf(S.profile, S.workouts)), { [it.s]:id });
    saveProfile(); buzz(10); toast(`${mateName(charOf(curProf()))} в обновке: «${it.n}»`); render();
  },
  freezeOn: el => {
    const n = +el.dataset.d; if (!(n >= 1 && n <= 14) || !canFreeze(S.profile.freeze)) return;
    const a = startOfDay(Date.now()); S.profile.freeze.push({ from:a, to:addDays(a, n - 1) });
    saveProfile(); buzz([10, 40, 10]); toast(`Заморозка до ${dayMonth(addDays(a, n - 1))}`); render();
  },
  freezeOff: () => { const f = frozenNow(S.profile.freeze); if (!f) return; f.to = addDays(startOfDay(Date.now()), -1); saveProfile(); toast('Заморозка снята. С возвращением!'); render(); },
  /* supplements */
  supTake: el => {
    const r = supToggle(el.dataset.id, +el.dataset.day || startOfDay(Date.now())); if (!r) return;
    if (r.on) buzz(r.full ? [10, 40, 10] : 10); if (r.full) toast('Все добавки по плану · +10 XP');
    S.bubble = null; render();
  },
  supDayShift: el => { const today = startOfDay(Date.now()), cur = Math.min(today, S.supDay || today); S.supDay = Math.max(addDays(today, -6), Math.min(today, addDays(cur, +el.dataset.d))); render(); },
  supNew: () => openSheet({ type:'sup', isNew:true, id:uid(), d:supDraft(null), confirm:false }),
  supQuick: el => { const q = SUP_QUICK[+el.dataset.i]; if (!q) return; const d = supDraft(null); d.name = q[0]; d.dose = q[1]; d.unit = q[2]; d.when = q[3]; openSheet({ type:'sup', isNew:true, id:uid(), d, confirm:false }); },
  supEdit: el => { const s = S.profile.supps.find(x => x.id === el.dataset.id); if (s) openSheet({ type:'sup', isNew:false, id:s.id, d:supDraft(s), confirm:false }); },
  supSet: el => { const sh = top(); sh.d[el.dataset.f] = el.dataset.v; render(); },
  supAllDays: () => { top().d.days = []; render(); },
  supDayT: el => { const d = top().d, v = +el.dataset.v, i = d.days.indexOf(v); if (i >= 0) d.days.splice(i, 1); else d.days.push(v); if (d.days.length === 7) d.days = []; render(); },
  supCourseT: () => { const d = top().d; d.course = !d.course; render(); },
  supOffT: () => { const d = top().d; d.off = !d.off; render(); },
  supSave: () => {
    const sh = top(), d = sh.d, name = (d.name || '').trim();
    if (!name) { toast('Введите название'); const n = $('#sup-name'); if (n) n.focus(); return; }
    const dose = parseNum(d.dose), stock = String(d.stock).trim() === '' ? null : parseNum(d.stock);
    const cf = d.course ? keyDay(d.cf || dayKey(Date.now())) : null;
    const s = { id:sh.id, name:name.slice(0, 40), dose: dose != null ? dose : (String(d.dose).trim() || ''), unit:String(d.unit || '').slice(0, 12), when:d.when || 'any', days:[...d.days].sort(), note:(d.note || '').trim().slice(0, 60) };
    if (d.course && Number.isFinite(cf)) { s.cf = cf; s.cd = Math.max(1, +d.cw || 8) * 7; }
    if (stock != null) s.stock = stock;
    if (d.off) s.off = true;
    const list = S.profile.supps, i = list.findIndex(x => x.id === sh.id);
    if (i >= 0) list[i] = s; else list.push(s);
    // the plan for today may have changed: refresh «full day» for today only, past days stay as they were
    const today = startOfDay(Date.now()), st = supDay(S.profile, today), f = new Set(S.profile.sfull); if (st.full) f.add(dayKey(today)); else f.delete(dayKey(today)); S.profile.sfull = [...f].sort();
    saveProfile(); S.sheets.pop(); buzz(10); toast(i >= 0 ? 'Сохранено' : `«${s.name}» в плане`); render();
  },
  supDel: () => {
    const sh = top(); if (!sh.confirm) { sh.confirm = true; render(); return; }
    S.profile.supps = S.profile.supps.filter(x => x.id !== sh.id);
    Object.keys(S.profile.slog).forEach(k => { const l = S.profile.slog[k].filter(id => id !== sh.id); if (l.length) S.profile.slog[k] = l; else delete S.profile.slog[k]; });
    saveProfile(); S.sheets.pop(); toast('Добавка удалена'); render();
  },
  supOrder: () => { S.supOrder = !S.supOrder; render(); },
  supMove: el => { const l = S.profile.supps, i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; buzz(6); saveProfile(); render(); },
  /* debug */
  dbgDay: el => { const d = +el.dataset.d; try { localStorage.setItem('podhod-dbg-shift', String(d ? dbgShift() + d : 0)); } catch (e) { /* storage off */ } S.bubble = null; render(); toast(`Сегодня: ${dayMonth(Date.now())}`); },
  dbgWorkout: () => {
    const now = Date.now(), w = { id:uid(), title:'Тест', tpl:null, start:now - 3600000, end:now, exercises:[{ k:uid(), ex:'bench', sets:Array.from({ length:4 }, () => ({ w:60, r:8, done:true })) }, { k:uid(), ex:'squat', sets:Array.from({ length:4 }, () => ({ w:80, r:6, done:true })) }] };
    commitWorkout(w);
  },
  dbgChests: () => { S.profile.chest.st.push(...[1, 2, 3].map(() => 'st-' + uid())); saveProfile(); toast('+3 сундука'); render(); },
  dbgOpenAll: () => { const cs = chestState(); cs.closed.forEach(ch => { S.profile.chest.op[ch.id] = rollChest(ch); }); saveProfile(); toast(`Открыто: ${cs.closed.length}`); render(); },
});
Object.assign(IN, {
  supF: el => { const sh = top(); if (sh && sh.d) sh.d[el.dataset.f] = el.value; },
});

/* ================= events ================= */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.in && IN[el.dataset.in]) IN[el.dataset.in](el, e); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.ch && CHG[el.dataset.ch]) CHG[el.dataset.ch](el, e); });
document.addEventListener('focusin', e => {
  const el = e.target; if (!el.dataset || el.dataset.in !== 'set' || el.dataset.f !== 'w') return;
  const c = ctx(el); if (!c || c.ex.equip !== 'barbell') return;
  const pl = document.getElementById('pl-' + c.x.k); if (pl) pl.innerHTML = platesHTML(num(c.s.w) ?? ghost(c.w, c.x, c.si, c.ex.kind).w ?? 0, S.profile.bar);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheets.length) { closeSheet(); return; }
  const el = e.target;
  if (e.key === 'Enter' && el.dataset && el.dataset.in === 'set') {
    e.preventDefault();
    const c = ctx(el); if (!c) return; const fs = KINDS[c.ex.kind].f.map(f => f[0]);
    if (el.dataset.f === fs[0]) { const nx = document.getElementById(`s-${c.x.k}-${c.si}-${fs[1]}`); if (nx) nx.focus(); }
    else { el.blur(); if (!c.s.done) { const btn = el.closest('.set-row').querySelector('.set-check'); A.setDone(btn || el); } }
  }
  if (e.key === 'Enter' && el.id === 'b-w') { e.preventDefault(); A.bodyAdd(); }
  if (e.key === 'Enter' && el.id && el.id.startsWith('m-') && el.id !== 'm-date') { e.preventDefault(); A.measAdd(); }
  if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('for') === 'ph-file') { e.preventDefault(); const f = $('#ph-file'); if (f) f.click(); }
  if (e.key === 'Enter' && el.id === 'w-title') { e.preventDefault(); el.blur(); }
  if (e.key === 'Enter' && el.id === 'wl-name') { e.preventDefault(); A.welcomeSave(); }
  if (e.key === 'Enter' && el.id === 'np-name') { e.preventDefault(); A.profCreate(); }
  if (e.key === 'Enter' && el.id === 'cp-name') { e.preventDefault(); el.blur(); }
  if (e.key === 'Enter' && el.id && el.id.startsWith('sup-')) { e.preventDefault(); el.blur(); }
  if (e.key === 'Enter' && !e.shiftKey && el.id === 'chat-in') { e.preventDefault(); A.chatSend(); }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== S.view) { S.editing = null; S.view = v; S.sheets = []; render(); window.scrollTo(0, 0); } });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawCharts(true); moveInd(); }, 150); });
try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme); } catch (e) { /* old browser */ }

const h0 = location.hash.slice(1); if (VIEWS.includes(h0)) S.view = h0;
boot();
})();
</script>
